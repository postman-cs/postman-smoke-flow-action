name: Backfill npm

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Ordered space-separated immutable tags, oldest first
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish immutable release assets to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; fi
          PKG_NAME='@postman/onboarding-smoke-flow'
          for TAG in $TAGS; do
            TAG_DIR="$(mktemp -d)"
            trap 'rm -rf "$TAG_DIR"' EXIT
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release.tgz' --dir "$TAG_DIR"
            TARBALL="$TAG_DIR/release.tgz"
            test -f "$TARBALL"
            PACKAGE_JSON="$(tar -xOf "$TARBALL" package/package.json)"
            NAME="$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$PACKAGE_JSON")"
            VERSION="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$PACKAGE_JSON")"
            test "$NAME" = "$PKG_NAME"
            test "$VERSION" = "${TAG#v}"
            if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG_NAME@$VERSION already exists; skipping"
            else
              npm publish "$TARBALL" --provenance --access public --tag backfill
            fi
            rm -rf "$TAG_DIR"
            trap - EXIT
          done
          HIGHEST="$(npm view "$PKG_NAME" versions --json | node -e '
            let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => {
              const versions = JSON.parse(input); const parse = version => {
                const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
                return match ? [Number(match[1]), Number(match[2]), Number(match[3]), match[4] ?? ""] : null;
              };
              const ordered = (Array.isArray(versions) ? versions : [versions]).filter(version => parse(version)).sort((a, b) => {
                const left = parse(a); const right = parse(b);
                for (let i = 0; i < 3; i++) if (left[i] !== right[i]) return left[i] - right[i];
                if (!left[3] && right[3]) return 1; if (left[3] && !right[3]) return -1;
                return left[3].localeCompare(right[3], undefined, { numeric: true });
              });
              if (!ordered.length) process.exit(1); console.log(ordered.at(-1));
            });
          ')"
          npm dist-tag add "$PKG_NAME@$HIGHEST" latest
